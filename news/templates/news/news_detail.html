{% extends "default.html" %}
{% load censor %}

{% block title %}{{ post.title|censor }}{% endblock %}

{% block content %}
    <article>
        <h2>{{ post.title|censor }}</h2>
        <p>Дата публикации: {{ post.created_at|date:"d.m.Y" }}</p>
        <div>{{ post.text|censor|linebreaks }}</div>
    </article>

    <p><a href="{% url 'news_list' %}">Вернуться к новостям</a></p>
{% endblock %}
